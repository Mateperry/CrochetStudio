<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var savedTheme = localStorage.getItem('crochet-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" />
    <title>Crochet Studio · Amigurumis tejidos a mano</title>
    <meta
      name="description"
      content="Amigurumis tejidos a mano, uno por uno: anime, películas, series, animales y diseños personalizados."
    />

    <!-- Open Graph / Twitter (generic; product pages update them at runtime). -->
    <meta property="og:site_name" content="Crochet Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Crochet Studio · Amigurumis tejidos a mano" />
    <meta
      property="og:description"
      content="Amigurumis tejidos a mano, uno por uno: anime, películas, series, animales y diseños personalizados."
    />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Crochet Studio · Amigurumis tejidos a mano" />
    <meta
      name="twitter:description"
      content="Amigurumis tejidos a mano, uno por uno: anime, películas, series, animales y diseños personalizados."
    />
    <meta name="twitter:image" content="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
